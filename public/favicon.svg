<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular com anel de latão/ouro -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Dentes mecânicos do rotor da Enigma -->
  <circle cx="32" cy="32" r="24" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3.5 2"/>

  <!-- Letra P elegante de Parábola em ouro escovado -->
  <path d="M22 16h11c5.523 0 10 4.03 10 9s-4.477 9-10 9H28v14h-6V16zm6 12h5c2.209 0 4-1.343 4-3s-1.791-3-4-3h-5v6z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Ponto de brilho / lâmpada indicadora acesa -->
  <circle cx="33" cy="45" r="2.5" fill="#fbbf24"/>
  <circle cx="33" cy="45" r="1" fill="#ffffff"/>
</svg>